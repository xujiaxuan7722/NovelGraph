<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovelGraph</title>
<style>
  :root{--paper:#f6f1e5;--card:#fdfaf2;--ink:#2b2620;--dim:#8a7f6d;--red:#a63b2a;--line:#e3d9c4;--gold:#b8860b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);height:100vh;display:flex;flex-direction:column;
       font:15px/1.85 "Noto Serif SC","Source Han Serif SC","STSong","SimSun",serif}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:18px;padding:18px 28px 10px;border-bottom:2px solid var(--red)}
  header h1{margin:0;font-size:22px;letter-spacing:2px}
  header h1 i{font-style:normal;color:var(--red)}
  .books{display:flex;gap:8px}
  .books button{font:inherit;font-size:14px;padding:2px 14px;border:1px solid var(--line);background:var(--card);
    color:var(--dim);border-radius:2px;cursor:pointer;letter-spacing:2px}
  .books button.on{background:var(--red);color:#f6f1e5;border-color:var(--red)}
  .tabs{margin-left:auto;display:flex;gap:14px;font-size:14px}
  .tabs a{color:var(--dim);text-decoration:none;cursor:pointer;padding-bottom:2px}
  .tabs a.on{color:var(--red);border-bottom:2px solid var(--red)}
  #stats{padding:6px 28px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);letter-spacing:.5px}
  #stats b{color:var(--red);font-weight:600}
  main{flex:1;display:flex;min-height:0}
  /* 左：人物列表 */
  #roster{width:230px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--card)}
  #roster input{margin:12px 14px 8px;padding:6px 10px;font:inherit;font-size:13.5px;border:1px solid var(--line);
    background:var(--paper);border-radius:2px;outline:none}
  #roster input:focus{border-color:var(--red)}
  #plist{overflow-y:auto;flex:1;padding:0 0 20px}
  #plist div{padding:5px 18px;cursor:pointer;display:flex;justify-content:space-between;font-size:14.5px}
  #plist div:hover{background:var(--paper)}
  #plist div.on{color:var(--red);background:var(--paper);border-right:3px solid var(--red);font-weight:600}
  #plist span{color:var(--dim);font-size:12px}
  /* 中：档案 */
  #profile{flex:1;overflow-y:auto;padding:26px 40px 60px}
  #pname{font-size:30px;margin:0;letter-spacing:3px}
  #pname small{font-size:13px;color:var(--dim);letter-spacing:1px;margin-left:12px}
  #pid{color:var(--dim);margin:6px 0 2px;max-width:56em}
  .alias{display:inline-block;border:1px solid var(--line);border-radius:2px;padding:0 8px;margin:2px 6px 2px 0;
    font-size:12.5px;color:var(--dim);background:var(--card)}
  .relgroups{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px;align-items:start}
  .rg{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:12px 16px 8px}
  .rg h4{margin:0 0 6px;font-size:15px;color:var(--red);letter-spacing:2px;border-bottom:1px dashed var(--line);padding-bottom:5px}
  .rg h4 span{float:right;color:var(--dim);font-size:12px;letter-spacing:0}
  details{border-bottom:1px solid #efe8d6}
  details:last-child{border-bottom:none}
  summary{list-style:none;cursor:pointer;padding:5px 0;display:flex;align-items:baseline;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary .who{font-size:15px}
  summary .who:hover{color:var(--red)}
  .badge{font-size:11px;border-radius:2px;padding:0 5px;letter-spacing:0}
  .b-txt{background:#ece4d0;color:#6e6046}.b-mk{background:#e8d7cf;color:#8c4f3a}.b-inf{background:#dde3ea;color:#4a617e}
  .b-v{color:var(--gold);font-size:12px;margin-left:auto}
  .evbox{padding:2px 0 10px;font-size:13.5px;color:#5a5142}
  .evbox .ev{border-left:3px solid var(--red);background:var(--paper);padding:5px 10px;margin:5px 0;border-radius:0 3px 3px 0}
  .evbox .meta{color:var(--dim);font-size:12.5px}
  .evbox .sup{display:inline-block;border:1px solid var(--line);padding:0 6px;margin:2px 4px 0 0;font-size:12px;color:var(--dim)}
  /* 表格页 */
  #tablePage{flex:1;overflow-y:auto;padding:20px 28px;display:none}
  #tablePage .bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  #tablePage select,#tablePage input{font:inherit;font-size:13.5px;padding:4px 8px;border:1px solid var(--line);background:var(--card);border-radius:2px}
  table{width:100%;border-collapse:collapse;background:var(--card);font-size:13.5px}
  th,td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
  th{background:var(--paper);color:var(--dim);font-weight:600;letter-spacing:1px;position:sticky;top:0}
  td.ev{color:#5a5142;font-size:12.5px;max-width:34em}
  .hint{color:var(--dim);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1><i>Novel</i>Graph<small style="color:var(--dim);font-size:12px;letter-spacing:1px">　长篇小说人物关系图谱</small></h1>
  <div class="books" id="books"></div>
  <div class="tabs"><a id="tabP" class="on">人物档案</a><a id="tabT">全部关系</a></div>
</header>
<div id="stats"></div>
<main>
  <div id="roster"><input id="q" placeholder="搜索人物…"><div id="plist"></div></div>
  <div id="profile"></div>
  <div id="tablePage">
    <div class="bar">
      <select id="fLayer"><option value="">全部来源层</option><option>LLM抽取</option><option>模型知识</option><option>推导</option></select>
      <select id="fRel"><option value="">全部关系</option></select>
      <input id="fQ" placeholder="按人名过滤…">
      <span class="hint" id="fCount"></span>
    </div>
    <table><thead><tr><th>头</th><th>关系</th><th>尾</th><th>来源</th><th>票</th><th>证据 / 推导链</th></tr></thead>
    <tbody id="tbody"></tbody></table>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const LB={'LLM抽取':['文本','b-txt'],'模型知识':['补充','b-mk'],'推导':['推导','b-inf']};
let RUNS=[],DATA=null,DEG={},me=null;
async function init(){
  RUNS=await (await fetch('/api/runs')).json();
  $('#books').innerHTML=RUNS.map(r=>`<button data-n="${r.name}">${r.book||r.name}</button>`).join('');
  document.querySelectorAll('#books button').forEach(b=>b.onclick=()=>load(b.dataset.n));
  const want=new URLSearchParams(location.search).get('run');
  load(want&&RUNS.some(r=>r.name===want)?want:RUNS[0].name);
}
async function load(name){
  document.querySelectorAll('#books button').forEach(b=>b.classList.toggle('on',b.dataset.n===name));
  DATA=await (await fetch('/api/run?name='+encodeURIComponent(name))).json();
  DEG={};DATA.triples.forEach(t=>{DEG[t.head]=(DEG[t.head]||0)+1;DEG[t.tail]=(DEG[t.tail]||0)+1;});
  const cnt={};DATA.triples.forEach(t=>cnt[t.source]=(cnt[t.source]||0)+1);
  const e=DATA.eval;
  $('#stats').innerHTML=`关系 <b>${DATA.triples.length}</b> 条（文本 ${cnt['LLM抽取']||0} · 补充 ${cnt['模型知识']||0} · 推导 ${cnt['推导']||0}）　实体 <b>${Object.keys(DATA.registry).length}</b>`+
    (e?`　对金标准：查准 <b>${(e.precision*100).toFixed(1)}%</b> 查全 <b>${(e.recall*100).toFixed(1)}%</b> F1 <b>${(e.f1*100).toFixed(1)}%</b>`:'');
  $('#fRel').innerHTML='<option value="">全部关系</option>'+[...new Set(DATA.triples.map(t=>t.relation))].map(r=>`<option>${r}</option>`).join('');
  roster();
  const top=list().find(([n])=>(DATA.registry[n]||{}).type==='人物')||list()[0];
  if(top)show(top[0]); table();
}
function list(){
  const q=$('#q').value.trim();
  return Object.entries(DEG).filter(([n])=>{const e=DATA.registry[n];return e&&(!q||n.includes(q)||(e.aliases||[]).some(a=>a.includes(q)));})
    .sort((a,b)=>b[1]-a[1]);
}
function roster(){
  $('#plist').innerHTML=list().slice(0,300).map(([n,d])=>`<div data-n="${n}" class="${n===me?'on':''}">${n}<span>${d}</span></div>`).join('');
  document.querySelectorAll('#plist div').forEach(d=>d.onclick=()=>show(d.dataset.n));
}
function evHtml(t){
  let h='<div class="evbox">';
  (t.evidences||[t.evidence]).filter(Boolean).forEach(e=>h+=`<div class="ev">${e}</div>`);
  const meta=[];
  if(t.evidence_src)meta.push('证据来源：'+t.evidence_src);
  if(t.chapters&&t.chapters.length)meta.push('章节：'+t.chapters.slice(0,10).join('、'));
  if(meta.length)h+=`<div class="meta">${meta.join('　')}</div>`;
  if(t.review)h+=`<div class="meta">复核：${t.review}</div>`;
  if(t.reason)h+=`<div class="meta">模型理由：${t.reason}</div>`;
  if(t.rule){h+=`<div class="meta">推导规则：${t.rule}</div>`;(t.support||[]).forEach(s=>h+=`<span class="sup">${s}</span>`);}
  return h+'</div>';
}
function show(name){
  me=name;$('#tabP').click();roster();
  const e=DATA.registry[name]||{};
  let h=`<h2 id="pname">${name}<small>${e.type||''}　关系 ${DEG[name]||0} 条</small></h2>`;
  if(e.identity)h+=`<p id="pid">${e.identity}</p>`;
  if((e.aliases||[]).length)h+=`<div>${e.aliases.map(a=>`<span class="alias">${a}</span>`).join('')}</div>`;
  const groups={},seen={};   // 同一（关系,对方）跨层去重：文本 > 补充 > 推导
  const prio={'LLM抽取':0,'模型知识':1,'推导':2};
  [...DATA.triples].sort((a,b)=>prio[a.source]-prio[b.source]).forEach(t=>{
    if(t.head!==name&&t.tail!==name)return;
    const other=t.head===name?t.tail:t.head;
    const k=t.relation+'|'+other;
    if(seen[k])return; seen[k]=1;
    const dir=t.head===name?'→':'←';
    (groups[t.relation]=groups[t.relation]||[]).push({t,other,dir});
  });
  h+='<div class="relgroups">';
  Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).forEach(([rel,items])=>{
    h+=`<div class="rg"><h4>${rel}<span>${items.length}</span></h4>`;
    items.sort((a,b)=>(b.t.votes||0)-(a.t.votes||0)).forEach(({t,other,dir})=>{
      const [lb,cls]=LB[t.source]||['?',''];
      h+=`<details><summary><span class="who" onclick="event.preventDefault();show('${other}')">${other}</span>
        <span class="hint">${dir==='→'?'':'（对方为主位）'}</span>
        <span class="badge ${cls}">${lb}</span><span class="b-v">${t.votes?('票 '+t.votes):''}</span></summary>${evHtml(t)}</details>`;
    });
    h+='</div>';
  });
  $('#profile').innerHTML=h+'</div>';$('#profile').scrollTop=0;
}
function table(){
  const L=$('#fLayer').value,R=$('#fRel').value,Q=$('#fQ').value.trim();
  const rows=DATA.triples.filter(t=>(!L||t.source===L)&&(!R||t.relation===R)&&(!Q||t.head.includes(Q)||t.tail.includes(Q)))
    .sort((a,b)=>(b.votes||0)-(a.votes||0));
  $('#fCount').textContent=`${rows.length} 条`+(rows.length>500?'（显示前 500）':'');
  $('#tbody').innerHTML=rows.slice(0,500).map(t=>{const[lb,cls]=LB[t.source]||['?',''];
    return `<tr><td>${t.head}</td><td style="color:var(--red)">${t.relation}</td><td>${t.tail}</td>
    <td><span class="badge ${cls}">${lb}</span></td><td>${t.votes||''}</td>
    <td class="ev">${t.evidence||(t.rule?('['+t.rule+'] '+(t.support||[]).join('；')):'')}</td></tr>`;}).join('');
}
$('#q').oninput=roster;
['fLayer','fRel','fQ'].forEach(id=>$('#'+id).oninput=table);
$('#tabP').onclick=()=>{$('#tabP').classList.add('on');$('#tabT').classList.remove('on');
  $('#profile').style.display='block';$('#roster').style.display='flex';$('#tablePage').style.display='none';};
$('#tabT').onclick=()=>{$('#tabT').classList.add('on');$('#tabP').classList.remove('on');
  $('#profile').style.display='none';$('#roster').style.display='none';$('#tablePage').style.display='block';};
init();
</script>
</body>
</html>
